<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klipper IP Finder</title>
  
  <!-- PWA Manifest & Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Klipper Finder">

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #10b981;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.5rem;
      margin: 0;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
    }

    .input-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    input {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
    }

    button {
      padding: 0.75rem 1.25rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: 1rem;
      min-height: 1.25rem;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      background: var(--card);
      padding: 1rem;
      margin-bottom: 0.5rem;
      border-radius: 8px;
      border-left: 4px solid var(--success);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.05rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Klipper IP Finder</h1>
    <div class="subtitle">Scan your network for Moonraker instances on port 7125</div>

    <div class="input-group">
      <input type="text" id="subnet" placeholder="e.g. 192.168.1">
      <button id="scanBtn" onclick="scan()">Scan</button>
    </div>

    <div class="status" id="status">Initializing...</div>
    <ul id="results"></ul>
  </div>

  <script>
    // Register PWA Service Worker for offline app caching
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    const COMMON_SUBNETS = ["192.168.1", "192.168.0", "10.0.0", "172.16.0"];

    window.addEventListener("DOMContentLoaded", async () => {
      const savedSubnet = localStorage.getItem("klipper_subnet");
      const subnetInput = document.getElementById("subnet");

      if (savedSubnet) {
        subnetInput.value = savedSubnet;
        document.getElementById("status").innerText = `Loaded saved subnet: ${savedSubnet}`;
      } else {
        document.getElementById("status").innerText = "Detecting local subnet...";
        const detected = await detectSubnet();
        subnetInput.value = detected;
        document.getElementById("status").innerText = `Auto-detected subnet: ${detected}`;
      }
    });

    async function detectSubnet() {
      const probePromises = COMMON_SUBNETS.map((subnet) => {
        return new Promise((resolve) => {
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 1000);

          fetch(`http://${subnet}.1`, { mode: "no-cors", signal: controller.signal })
            .then(() => resolve(subnet))
            .catch((err) => {
              if (err.name !== "AbortError") resolve(subnet);
            })
            .finally(() => clearTimeout(timeout));
        });
      });

      const result = await Promise.race([
        ...probePromises,
        new Promise((res) => setTimeout(() => res(null), 1200))
      ]);

      return result || "192.168.1";
    }

    async function scan() {
      const subnet = document.getElementById("subnet").value.trim();
      const resultsList = document.getElementById("results");
      const statusText = document.getElementById("status");
      const btn = document.getElementById("scanBtn");

      if (!subnet) return;

      localStorage.setItem("klipper_subnet", subnet);

      resultsList.innerHTML = "";
      btn.disabled = true;
      statusText.innerText = `Scanning ${subnet}.1 to ${subnet}.254 on port 7125...`;

      let count = 0;
      const tasks = [];

      for (let i = 1; i <= 254; i++) {
        const ip = `${subnet}.${i}`;
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 1200);

        const task = fetch(`http://${ip}:7125/server/info`, { signal: controller.signal })
          .then(async (res) => {
            if (res.ok) {
              const data = await res.json();
              if (data?.result?.klippy_state) {
                count++;
                const li = document.createElement("li");
                li.innerHTML = `<span>${ip}</span><a href="http://${ip}" target="_blank">Open UI &rarr;</a>`;
                resultsList.appendChild(li);
              }
            }
          })
          .catch(() => {})
          .finally(() => clearTimeout(timeout));

        tasks.push(task);
      }

      await Promise.all(tasks);
      btn.disabled = false;
      statusText.innerText = `Scan complete. Found ${count} active Klipper printer(s).`;
    }
  </script>
</body>
</html>
